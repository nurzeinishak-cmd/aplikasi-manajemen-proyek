<!DOCTYPE html>
<html lang="id">
<head>

<title>Uji Logika - Manajemen Proyek Gantt</title>
<style>
  body{margin:0;padding:24px;background:#eef2f7;color:#0f172a;

  .card{max-width:840px;margin:0 auto;background:#fff;border:1px solid #d5dbe5;
